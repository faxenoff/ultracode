# Development Configuration for UltraCode
# AGGRESSIVE settings for TEI Docker - high throughput

environment: development
debug: true

mcp:
  embedding:
    model: "all-MiniLM-L6-v2"
    provider: "tei"
    enabled: true
    fallbackToMemory: false
    apiKey: ""

    # OVMS - Docker-based OpenVINO inference (CPU)
    # Uses Mediapipe graph with V3 Embeddings API (text → vector)
    ovms:
      baseUrl: "http://127.0.0.1:8082"
      timeoutMs: 60000         # 1 min for small batches
      concurrency: 1           # Sequential for CPU stability
      checkServer: true        # Auto-start container if stopped

    # TEI - Alternative GPU provider
    tei:
      baseUrl: "http://127.0.0.1:8081"
      timeoutMs: 120000        # 2 min for massive batches
      concurrency: 16          # High parallelism
      checkServer: false

    useReranker: false
    rerankerModel: "ibm/granite-embedding-reranker:149m"
    rerankerTopK: 100
    rerankerFinalK: 10
    queryLanguage: "english"

    # Two-phase mode disabled - setTimeout fix resolved Bun + OpenVINO crashes
    twoPhaseMode: false

  server:
    host: "localhost"
    port: 3000
    timeout: 300000           # 5 min

  agents:
    maxConcurrent: 20
    defaultTimeout: 300000
    useParser: true
    devIndexBatch: 500  # Increased for fewer batches, better worker utilization

database:
  path: ""
  mode: "WAL"
  cacheSize: 10000
  mmapSize: 268435456        # 256MB
  synchronous: "NORMAL"
  tempStore: "MEMORY"

logging:
  level: "debug"
  format: "text"
  enableConsole: true
  outputFile: ""
  maxFileSize: "10MB"
  maxFiles: 3

parser:
  languages:
    - "typescript"
    - "javascript"
    - "python"
    - "c"
    - "cpp"
    - "rust"
    - "go"
    - "java"
    - "kotlin"
    - "bash"
  maxFileSize: 1048576       # 1MB
  timeout: 120000            # 2 min

  incremental:
    enabled: true
    cacheSize: 1000
    cacheTTL: 300000

  agent:
    maxConcurrency: 8
    memoryLimit: 2048
    priority: 8
    batchSize: 500  # Increased from 50 for fewer batches
    cacheSize: 209715200     # 200MB
    workerPoolSize: 8

indexing:
  autoIndex: false

git:
  enabled: true
  watchBranchChanges: true
  autoReindex: true
  diffMode: "incremental"
  pollIntervalMs: 3000
  watchUncommitted: true
  uncommittedPollIntervalMs: 5000
  includeUntracked: true
  # Debounce for embedding generation - wait for user to stop editing
  debounceMs: 60000              # 60 sec after last change
  bulkModeThreshold: 1000        # >1000 files = drop/rebuild index

indexer:
  maxConcurrency: 8
  memoryLimit: 2048
  priority: 7
  batchSize: 2000
  cacheSize: 209715200
  cacheTTL: 600000

devAgent:
  maxConcurrency: 8
  memoryLimit: 2048
  priority: 7

doraAgent:
  maxConcurrency: 8
  memoryLimit: 1024
  priority: 6

queryAgent:
  maxConcurrency: 50
  memoryLimit: 1024
  priority: 9
  simpleQueryTimeout: 500
  complexQueryTimeout: 5000
  cacheWarmupSize: 500

# Semantic Agent - Optimized for OVMS on CPU
semanticAgent:
  maxConcurrency: 2
  memoryLimit: 4096          # 4GB
  priority: 8
  batchSize: 50              # Large batch for single tokenization call, OVMS splits to 4 internally
  modelPath: "./models"
  queueBatchSize: 50         # Match batchSize for efficient processing

coordinator:
  maxConcurrency: 200
  memoryLimit: 1024
  priority: 10
  taskQueueLimit: 500
  loadBalancingStrategy: "least-loaded"
  resourceConstraints:
    maxMemoryMB: 8192
    maxCpuPercent: 95
    maxConcurrentAgents: 50
    maxTaskQueueSize: 500

conductor:
  maxConcurrency: 200
  memoryLimit: 1024
  priority: 10
  taskQueueLimit: 500
  loadBalancingStrategy: "least-loaded"
  resourceConstraints:
    maxMemoryMB: 8192
    maxCpuPercent: 95
    maxConcurrentAgents: 50
    maxTaskQueueSize: 500
  complexityThreshold: 8
  mandatoryDelegation: true

performance:
  monitoring:
    enabled: true
    collectMetrics: true
    metricsInterval: 10000

  optimization:
    enableVectorSearch: true
    enableParallelParsing: true
    maxWorkerThreads: 8

development:
  enableHotReload: true
  verboseLogging: true
  enableDebugEndpoints: true
  mockExternalServices: false

testing:
  enableTestMode: false
  useInMemoryDatabase: false
  skipSlowOperations: false

debugging:
  enableSourceMaps: true
  enableInspector: false
  preserveStackTraces: true
